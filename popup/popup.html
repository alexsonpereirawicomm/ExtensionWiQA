<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WiControl QA</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="launcher">
      <header class="launcher-header">
        <img src="../assets/logo-mark.svg" alt="" width="36" height="36">
        <div>
          <strong>WiControl QA</strong>
          <span id="projectStatus"><i></i>Carregando…</span>
        </div>
      </header>

      <section class="launcher-copy" aria-labelledby="launcherTitle">
        <span>Workspace de qualidade</span>
        <h1 id="launcherTitle">Registre sem perder o contexto.</h1>
        <p>Capture a página, dite a descrição e revise tudo no painel lateral.</p>
      </section>

      <button id="btnOpenPanel" class="button button-primary" type="button">
        Abrir painel de QA
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
      </button>

      <button id="btnQuickScreenshot" class="button button-secondary" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h3l1.4-2h7.2l1.4 2h3v11H4z"></path><circle cx="12" cy="13" r="3.4"></circle></svg>
        Captura rápida
      </button>

      <p id="launcherMessage" class="launcher-message" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
